<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에어리스 팁(Tip) 시뮬레이터 (스마트 UI)</title>
    <style>
        /* 전체 다크 테마 배경 및 폰트 */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #0f172a; margin: 0; padding: 20px; text-align: center; color: #f8fafc; }
        
        /* 앱 화면 (글래스모피즘 & 그림자 효과) */
        .game-board { background: linear-gradient(145deg, #1e293b, #0f172a); max-width: 450px; margin: 0 auto; padding: 25px 20px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1); border: 1px solid #334155; }
        
        /* 세련된 제목 디자인 */
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(56,189,248,0.3); letter-spacing: 1px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        
        /* 시편(철판) 패널: 옐로우 도료 대비를 위한 딥 블랙 유지 & 입체감 부여 */
        #panel-container { position: relative; width: 400px; height: 400px; margin: 0 auto 15px auto; background-color: #0a0f18; border: 3px solid #020617; border-radius: 12px; box-shadow: inset 0 0 25px rgba(0,0,0,0.9); overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; z-index: 2; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        
        /* 세로 분사를 위한 폭 가이드라인 */
        .guide-line-h { position: absolute; width: 100%; border-top: 1px dashed rgba(100,116,139,0.5); left: 0; z-index: 1; display: flex; justify-content: flex-end; align-items: flex-start; padding-right: 10px; color: rgba(100,116,139,0.8); font-size: 12px; font-weight: bold; box-sizing: border-box; }
        .guide-center { top: 200px; border-top: 1px solid rgba(148,163,184,0.3); }
        .guide-30-t { top: 120px; } .guide-30-b { top: 280px; }
        .guide-40-t { top: 70px; }  .guide-40-b { top: 330px; }
        .guide-50-t { top: 20px; }  .guide-50-b { top: 380px; }

        /* 📸 실제 스프레이 건 이미지 세팅 (우측 배치) */
        #gun-nozzle { 
            position: absolute; 
            top: 140px; 
            left: 260px; 
            width: 100px; 
            height: 100px;
            object-fit: cover; 
            border-radius: 12px; 
            border: 2px solid #64748b;
            filter: drop-shadow(5px 10px 8px rgba(0,0,0,0.6));
            z-index: 10; 
            transform: rotate(90deg); 
        }
        
        /* 스프레이 발사 시 총기 반동 애니메이션 */
        @keyframes recoil {
            0% { transform: rotate(90deg) translateY(0px); }
            25% { transform: rotate(88deg) translateY(-3px); }
            50% { transform: rotate(92deg) translateY(3px); }
            75% { transform: rotate(88deg) translateY(-3px); }
            100% { transform: rotate(90deg) translateY(0px); }
        }
        .shooting { animation: recoil 0.05s infinite; }

        /* 조작부 (미래지향적 UI) */
        .controls { text-align: left; background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #334155; }
        .select-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        .select-group label { font-weight: bold; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        
        /* 다크모드 드롭다운(선택창) 디자인 */
        select { background-color: #0f172a; color: #f8fafc; padding: 12px; font-size: 15px; border-radius: 8px; border: 1px solid #334155; font-family: inherit; font-weight: bold; cursor: pointer; outline: none; transition: all 0.2s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        select:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.3); }
        select optgroup { color: #94a3b8; font-style: normal; }
        select option { color: #f8fafc; }

        /* 3D 입체 버튼 */
        .btn-start { width: 100%; padding: 16px; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; box-shadow: 0 5px 15px rgba(37,99,235,0.4); text-shadow: 1px 1px 2px rgba(0,0,0,0.3); transition: all 0.2s; letter-spacing: 1px; }
        .btn-start:hover { background: linear-gradient(135deg, #1d4ed8, #2563eb); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,99,235,0.6); }
        .btn-start:active { transform: translateY(2px); box-shadow: 0 2px 10px rgba(37,99,235,0.4); }
        .btn-start:disabled { background: #475569; color: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }
        
        /* 결과 설명창 (시스템 콘솔 느낌) */
        #result-box { margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.25); border: 1px solid #334155; border-radius: 10px; text-align: left; }
        #result-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
        #result-desc { font-size: 14px; color: #cbd5e1; line-height: 1.6; }
        .highlight { font-weight: bold; color: #f43f5e; text-shadow: 0 0 5px rgba(244,63,94,0.4); }
        .good { font-weight: bold; color: #10b981; }
    </style>
</head>
<body>

<div class="game-board">
    <h2>🎯 스마트 팁(Tip) 시뮬레이터</h2>
    <p class="subtitle">AIRLESS NOZZLE TIP SELECTION SYSTEM</p>

    <!-- 시편(철판) 화면 (블랙 컬러 + 네온 가이드) -->
    <div id="panel-container">
        <!-- 폭 가이드라인 -->
        <div class="guide-line-h guide-50-t">50° (넓음)</div>
        <div class="guide-line-h guide-40-t">40° (보통)</div>
        <div class="guide-line-h guide-30-t">30° (좁음)</div>
        <div class="guide-line-h guide-center">중심축</div>
        <div class="guide-line-h guide-30-b">30°</div>
        <div class="guide-line-h guide-40-b">40°</div>
        <div class="guide-line-h guide-50-b">50°</div>
        
        <canvas id="paint-canvas" width="400" height="400"></canvas>
        
        <!-- 📸 실제 스프레이 건 이미지 -->
        <img id="gun-nozzle" src="KakaoTalk_20260810_204330582.jpg" alt="실제 에어리스 건">
    </div>

    <!-- 결과 설명창 (디지털 콘솔 패널) -->
    <div id="result-box">
        <div id="result-title">시스템 대기 중...</div>
        <div id="result-desc">스프레이 팁(Tip) 규격을 세팅하고 발사 버튼을 누르세요.</div>
    </div>

    <!-- 세련된 컨트롤 패널 -->
    <div class="controls">
        <div class="select-group">
            <label>⚙️ 에어리스 팁(Tip) 규격 세팅:</label>
            <select id="tip-select">
                <optgroup label="분사폭 30도 (각철/협소구역용)">
                    <option value="315">315 (토출량 매우 적음)</option>
                    <option value="317">317 (토출량 적음)</option>
                    <option value="319">319 (토출량 보통)</option>
                    <option value="321">321 (토출량 많음)</option>
                    <option value="323">323 (토출량 매우 많음)</option>
                    <option value="325">325 (토출량 과다)</option>
                </optgroup>
                <optgroup label="분사폭 40도 (일반 평판용)">
                    <option value="415">415</option>
                    <option value="419" selected>419 (현장 표준/가장 많이 씀)</option>
                    <option value="421">421</option>
                    <option value="423">423</option>
                    <option value="425">425</option>
                </optgroup>
                <optgroup label="분사폭 50도 (대형 외판용)">
                    <option value="515">515</option>
                    <option value="517">517</option>
                    <option value="519">519</option>
                    <option value="521">521</option>
                    <option value="523">523</option>
                    <option value="525">525 (최대 토출량)</option>
                </optgroup>
            </select>
        </div>
        <button class="btn-start" id="start-btn" onclick="startSpray()">도장 작업 실행 ▶</button>
    </div>
</div>

<script>
    function startSpray() {
        const tip = document.getElementById('tip-select').value;
        const angleDigit = parseInt(tip.charAt(0)); 
        const orificeSize = parseInt(tip.substring(1)); 
        
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        const gun = document.getElementById('gun-nozzle');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const startBtn = document.getElementById('start-btn');
        
        startBtn.disabled = true;
        startBtn.innerText = "분사 시스템 가동 중...";
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 총기 반동 애니메이션 시작
        gun.classList.add('shooting');

        let targetHeight = 0;
        let angleText = "";
        if (angleDigit === 3) { targetHeight = 160; angleText = "30도 (좁음)"; }
        else if (angleDigit === 4) { targetHeight = 260; angleText = "40도 (보통)"; }
        else if (angleDigit === 5) { targetHeight = 360; angleText = "50도 (넓음)"; }

        let targetWidth = 0;
        let opacity = 0;
        let amountText = "";
        let isSagging = false;

        // 블랙 패널 위에 잘 보이는 옐로우 컬러 투명도
        if (orificeSize === 15) { targetWidth = 25; opacity = 0.4; amountText = "매우 적음 (0.015\") - 얇은 도막"; }
        else if (orificeSize === 17) { targetWidth = 35; opacity = 0.6; amountText = "적음 (0.017\")"; }
        else if (orificeSize === 19) { targetWidth = 50; opacity = 0.8; amountText = "보통 (0.019\") - 현장 표준"; }
        else if (orificeSize === 21) { targetWidth = 70; opacity = 0.95; amountText = "많음 (0.021\") - 후막형 도료용"; }
        else if (orificeSize === 23) { targetWidth = 90; opacity = 1.0; amountText = "매우 많음 (0.023\") - 칠 주의"; }
        else if (orificeSize === 25) { targetWidth = 110; opacity = 1.0; amountText = "과다 (0.025\") - 흐름(새깅) 위험!"; isSagging = true; }

        resultTitle.innerText = `🔍 분석 완료: [TIP 번호 ${tip}]`;
        resultDesc.innerHTML = `
            • <span style="color:#94a3b8;">분사폭(세로 방향 길이):</span> <b style="color:#f8fafc;">${angleText}</b><br>
            • <span style="color:#94a3b8;">토출량(도막의 두께):</span> <b style="color:#f8fafc;">${amountText}</b><br>
            <br>
            ${isSagging ? "<span class='highlight'>🚨 시스템 경고: 구멍(Orifice)이 너무 커 도료가 과다 토출됩니다. 흐름(Sagging) 결함이 즉시 발생합니다!</span>" 
            : orificeSize <= 17 && angleDigit === 5 ? "<span class='highlight'>⚠️ 시스템 주의: 넓은 분사폭 대비 토출량이 부족합니다. 도막이 너무 얇게(Dry Spray) 입혀질 수 있습니다.</span>"
            : "<span class='good'>✅ 안정적이고 균일한 분사 패턴입니다.</span>"}
        `;

        let currentScale = 0;
        const animationTimer = setInterval(() => {
            currentScale += 0.05;
            if (currentScale >= 1) {
                currentScale = 1;
                clearInterval(animationTimer);
                startBtn.disabled = false;
                startBtn.innerText = "도장 작업 재실행 ▶";
                gun.classList.remove('shooting'); 
                
                // 흐름(새깅) 눈물자국 이펙트
                if (isSagging) {
                    ctx.fillStyle = `rgba(255, 220, 0, 0.95)`;
                    for (let i = 0; i < 6; i++) {
                        let dripX = 200 + (Math.random() - 0.5) * (targetWidth * 0.9);
                        let dripYStart = 200 + (targetHeight / 2) * 0.5; 
                        ctx.beginPath(); 
                        ctx.roundRect(dripX, dripYStart, 6, 50 + Math.random() * 80, 3); 
                        ctx.fill();
                    }
                }
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 🎨 도료 색상을 선명한 산업용 노란색(Yellow)으로 유지
            ctx.fillStyle = `rgba(255, 220, 0, ${opacity * currentScale})`;
            ctx.beginPath();
            ctx.ellipse(200, 200, (targetWidth / 2) * currentScale, (targetHeight / 2) * currentScale, 0, 0, Math.PI * 2);
            ctx.fill();

        }, 20); 
    }
</script>

</body>
</html>
